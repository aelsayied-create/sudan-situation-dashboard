name: Refresh data (HDX · HAPI · DTM · WFP)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"          # weekly, Monday morning
  push:
    paths: ["scripts/fetch_data.py"]

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install shapely openpyxl
      - run: python scripts/fetch_data.py
      - name: Commit refreshed raw data
        run: |
          git config user.name "sudan-data-bot"
          git config user.email "sudan-data-bot@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
